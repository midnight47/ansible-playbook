apiVersion: batch/v1
kind: CronJob
metadata:
  name: etcd-backup
  namespace: kube-system
spec:
  schedule: "0 10 * * *"
  timeZone: "Asia/Bishkek"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 1
  jobTemplate:
    spec:
      backoffLimit: 0
      ttlSecondsAfterFinished: 86400
      template:
        spec:
          hostNetwork: true
          dnsPolicy: ClusterFirstWithHostNet
          restartPolicy: Never
          nodeSelector:
            node-role.kubernetes.io/control-plane: ""
          tolerations:
          - key: node-role.kubernetes.io/control-plane
            operator: Exists
            effect: NoSchedule
          securityContext:
            runAsUser: 0
          containers:
          - name: etcd-backup
            image: registry.k8s.io/etcd:3.5.17-0
            imagePullPolicy: IfNotPresent
            env:
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            command:
            - /bin/sh
            - -c
            - |
              set -e
              export ETCDCTL_API=3

              echo "Node: ${NODE_NAME}"
              echo "Pod: ${POD_NAME}"

              etcdctl \
                --endpoints=https://127.0.0.1:2379 \
                --cacert=/ssl/ca.pem \
                --cert=/ssl/admin-${NODE_NAME}.pem \
                --key=/ssl/admin-${NODE_NAME}-key.pem \
                snapshot save /backup/etcd-${POD_NAME}.db

              echo "Snapshot saved: /backup/etcd-${POD_NAME}.db"
            volumeMounts:
            - mountPath: /ssl
              name: etcd-ssl
              readOnly: true
            - mountPath: /backup
              name: backup-dir
          volumes:
          - name: etcd-ssl
            hostPath:
              path: /etc/ssl/etcd/ssl
              type: Directory
          - name: backup-dir
            hostPath:
              path: /var/backups/etcd
              type: DirectoryOrCreate
