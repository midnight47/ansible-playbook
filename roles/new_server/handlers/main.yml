---
- name: restart ntpd
  service:
    name: ntpd
    state: restarted
    enabled: yes
  when: ansible_facts['os_family'] == 'RedHat'

- name: restart sshd
  service:
    name: sshd
    state: restarted
    enabled: yes
  when: ansible_facts['os_family'] == 'RedHat'

- name: restart ssh
  service:
    name: ssh
    state: restarted
    enabled: yes
  when: ansible_distribution in ['Debian', 'Ubuntu']

- name: restart ntp
  service:
    name: ntp
    state: restarted
    enabled: yes
  when:
    - ansible_distribution in ['Debian', 'Ubuntu']
    - not (ansible_distribution == 'Debian' and ansible_distribution_major_version | int >= 13)

- name: restart ntpsec
  service:
    name: ntpsec
    state: restarted
    enabled: yes
  when:
    - ansible_distribution == 'Debian'
    - ansible_distribution_major_version | int >= 13
